<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GripForce | Order Details</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #111111;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 80px auto;
      padding: 40px 25px;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 15px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      color: #555;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 28px;
      background: #111111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }

    .button:hover {
      opacity: 0.85;
    }

    .note {
      margin-top: 25px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">GRIPFORCE</div>

    <h1>Thanks for your payment! 🔥</h1>

    <p>
      Your PayPal payment should now be complete.
      Please enter your delivery details below so we can process your order.
    </p>

    <a
      href="https://docs.google.com/forms/d/e/1FAIpQLSfU36cT3htAMh-MqOW9Qnofk2V4ANn7LrDaEis3UPQu-W0Hrg/viewform?usp=headerherr"
      class="button"
      target="_blank"
    >
      Enter Order Details →
    </a>

    <div class="note">
      Please only complete this form after making your PayPal payment.
    </div>

  </div>

</body>
</html>
